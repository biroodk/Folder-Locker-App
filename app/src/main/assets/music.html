<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Folder Locker</title><link rel="stylesheet" href="category-style.css"><style>
.category-empty{margin:30px auto;width:82%;padding:25px;text-align:center;border:1px solid rgba(0,255,255,.25);border-radius:18px;background:rgba(0,255,255,.06);color:#8aa0c8}.category-empty b{display:block;color:#0ff;font-size:16px;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}.card{position:relative;border:1px solid rgba(0,255,255,.25);border-radius:14px;overflow:hidden;background:rgba(0,0,40,.65);min-height:150px}.card img,.media-preview{width:100%;height:130px;object-fit:cover;background:#000}.card-info{padding:8px;display:flex;flex-direction:column;gap:3px}.card-info b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-info span{font-size:9px;color:#8aa0c8}.card-menu-btn{position:absolute;right:7px;top:7px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);border:1px solid #0ff;color:#0ff;z-index:3;cursor:pointer}.card-menu{position:absolute;right:7px;top:42px;display:none;z-index:20;width:170px;background:#000040;border:1px solid #0ff;border-radius:12px;box-shadow:0 0 20px #0ff}.card-menu.show{display:block}.card-menu div{padding:11px;border-bottom:1px solid rgba(0,255,255,.12);font-size:12px}.card-menu .delete{color:#ff7777}.upload-fab{position:fixed;right:5%;bottom:9%;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#0af,#0ff);color:#000;font-size:30px;border:1px solid #0ff;box-shadow:0 0 20px #0ff;z-index:50}.back{cursor:pointer}.styled-alert{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}.styled-alert.show{display:flex}.styled-box{width:320px;background:linear-gradient(135deg,#000040,#020a1e);border:2px solid #0ff;border-radius:18px;padding:20px;text-align:center;box-shadow:0 0 30px #0ff}.styled-box h3{color:#0ff;margin:8px 0;border:0;background:none;width:auto}.styled-box p{color:#c0d0f0;font-size:13px;line-height:1.4}.styled-box input{width:90%;padding:10px;border-radius:10px;border:1px solid #0ff;background:#000;color:#fff}.styled-box button{margin-top:10px;width:100%;height:42px;border:0;border-radius:12px;background:linear-gradient(90deg,#0ff,#0a8cff);font-weight:bold}.viewer2{position:fixed;inset:0;background:#000040;z-index:1000;display:none;flex-direction:column}.viewer2.show{display:flex}.viewer2 header{position:static;width:auto;background:#000040}.viewer2 main{flex:1;display:flex;align-items:center;justify-content:center;padding:15px;overflow:auto}.viewer2 img,.viewer2 video{max-width:96%;max-height:75vh;border:1px solid #0ff;border-radius:12px}.viewer2 audio{width:90%}.viewer2 iframe{width:96%;height:78vh;border:1px solid #0ff;border-radius:12px;background:#fff}.toast2{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:2000;padding:11px 15px;border-radius:12px;border:1px solid #0ff;background:rgba(0,255,255,.12);color:#0ff;font-size:12px;display:none}.toast2.show{display:block}.toast2.error{border-color:#ff5555;color:#ff8a8a;background:rgba(255,60,60,.12)}
</style></head><body><section><header><div class="top-row"><div class="app-icon back" onclick="location.href='index.html'"><img src="icon.png" width="44" height="44" style="border-radius:8px"></div><div class="top-title"><div style="font-weight:bold" id="title">Folder Locker</div><div style="font-size:11px;color:#8aa0c8" id="sub">Private Vault</div></div><div class="top-actions"><div class="icon-btn" onclick="toggleSearch()">🔍</div><div class="icon-btn" onclick="toggleMainMenu()">⋮</div></div></div><div class="search-box" id="searchBox"><span>🔍</span><input id="search" oninput="loadCategory()" placeholder="Search..."><span onclick="toggleSearch()">✖️</span></div></header><main id="main"><div class="grid" id="grid"></div></main><footer><a href="index.html">🏠 Home</a><a class="active" href="files.html">📁 Files</a><a href="settings.html">⚙️ Settings</a></footer></section><input id="nativePicker" type="file" multiple hidden><button class="upload-fab" onclick="pickVault(CATEGORY)">+</button><div id="menu" class="card-menu" style="position:fixed;right:12px;top:64px;width:210px;z-index:9999"><div onclick="location.href='files.html'">📁 All Files</div><div onclick="pickVault(CATEGORY)">📤 Add files</div><div onclick="sortFiles('name')">🔤 Sort by name</div><div onclick="sortFiles('new')">🕒 Newest first</div></div><div class="styled-alert" id="alert"><div class="styled-box"><div id="aIcon" style="font-size:42px">🔒</div><h3 id="aTitle">Folder Locker</h3><p id="aMsg"></p><input id="aInput" style="display:none"><button onclick="closeAlert(true)">OK</button><button id="cancelBtn" style="display:none;background:rgba(255,255,255,.1);color:#aaa" onclick="closeAlert(false)">Cancel</button></div></div><div class="viewer2" id="viewer"><header><div class="top-row"><div class="icon-btn" onclick="closeViewer()">‹</div><div class="top-title"><div id="vName">File</div><div id="vMeta" style="font-size:11px;color:#8aa0c8"></div></div><div class="icon-btn" onclick="viewerMenu()">⋮</div></div></header><main id="viewerMain"></main></div><div class="toast2" id="toast"></div><script src="vault.js"></script><script>
const CATEGORY='music';let current=[];let alertResolve=null;const cfg=CATEGORY_RULES[CATEGORY]||CATEGORY_RULES.images;document.getElementById('title').textContent=cfg.label+' - Folder Locker';document.getElementById('sub').textContent='Only '+cfg.label.toLowerCase()+' are shown here';document.getElementById('nativePicker').addEventListener('change',e=>{browserPick(CATEGORY,e.target.files);e.target.value=''});
function toast(m,error=false){let t=document.getElementById('toast');t.textContent=m;t.className='toast2 show'+(error?' error':'');setTimeout(()=>t.className='toast2',2400)}function showAlert(icon,title,msg,input=false,def='',confirm=false){return new Promise(r=>{alertResolve=r;aIcon.textContent=icon;aTitle.textContent=title;aMsg.textContent=msg;aInput.style.display=input?'block':'none';aInput.value=def;cancelBtn.style.display=confirm?'block':'none';alert.classList.add('show')})}function closeAlert(v){alert.classList.remove('show');if(alertResolve){let r=alertResolve;alertResolve=null;r(v)}}function toggleSearch(){searchBox.classList.toggle('show');if(searchBox.classList.contains('show'))search.focus()}function toggleMainMenu(){menu.classList.toggle('show')}function viewerMenu(){showAlert('☰','File Menu','Use the ⋮ menu on the file card for rename or delete.')}
function sortFiles(t){if(t==='name')current.sort((a,b)=>a.name.localeCompare(b.name));else current.sort((a,b)=>b.time-a.time);render();menu.classList.remove('show');toast('Sorted')}
function loadCategory(){current=listVault(CATEGORY);let q=(search.value||'').toLowerCase();if(q)current=current.filter(f=>f.name.toLowerCase().includes(q));render()}
function render(){grid.innerHTML='';if(!current.length){grid.innerHTML='<div class="category-empty" style="grid-column:1/-1"><div style="font-size:45px">'+cfg.icon+'</div><b>No '+cfg.label.toLowerCase()+' yet</b><span>Tap + to add '+cfg.label.toLowerCase()+'. Only related file types are accepted.</span></div>';return}current.forEach((f,i)=>{let c=document.createElement('div');c.className='card';let m=f.mime||mimeFor(f.name);let visual=m.startsWith('image/')?`<img class="media-preview" src="${fileUrl(CATEGORY,f)}">`:m.startsWith('video/')?`<div class="media-preview" style="display:flex;align-items:center;justify-content:center;font-size:55px">🎬</div>`:m.startsWith('audio/')?`<div class="media-preview" style="display:flex;align-items:center;justify-content:center;font-size:55px">🎵</div>`:`<div class="media-preview" style="display:flex;align-items:center;justify-content:center;font-size:55px">📄</div>`;c.innerHTML=visual+`<div class="card-menu-btn" onclick="event.stopPropagation();document.querySelectorAll('.card-menu').forEach(x=>x.classList.remove('show'));document.getElementById('cm${i}').classList.toggle('show')">⋮</div><div class="card-menu" id="cm${i}"><div onclick="openFile(${i})">👁️ Open</div><div onclick="renameFile(${i})">✏️ Rename</div><div onclick="deleteFileAt(${i})" class="delete">🗑️ Delete</div></div><div class="card-info"><b>${escapeHtml(f.name)}</b><span>${formatSize(f.size)} • ${new Date(f.time).toLocaleString()}</span></div>`;c.addEventListener('click',e=>{if(!e.target.closest('.card-menu-btn')&&!e.target.closest('.card-menu'))openFile(i)});grid.appendChild(c)})}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatSize(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
function openFile(i){let f=current[i],u=fileUrl(CATEGORY,f),m=f.mime||mimeFor(f.name);vName.textContent=f.name;vMeta.textContent=formatSize(f.size);viewerMain.innerHTML='';if(m.startsWith('image/'))viewerMain.innerHTML=`<img src="${u}">`;else if(m.startsWith('video/'))viewerMain.innerHTML=`<video src="${u}" controls autoplay></video>`;else if(m.startsWith('audio/'))viewerMain.innerHTML=`<div style="text-align:center;width:100%"><div style="font-size:80px">🎵</div><p style="color:#0ff">${escapeHtml(f.name)}</p><audio src="${u}" controls autoplay></audio></div>`;else if(m==='application/pdf'||m.startsWith('text/'))viewerMain.innerHTML=`<iframe src="${u}"></iframe>`;else viewerMain.innerHTML='<div style="text-align:center;color:#8aa0c8">This document cannot be previewed here.<br>Use the Android system app to open it.</div>';viewer.classList.add('show')}
function closeViewer(){viewer.classList.remove('show')}
async function renameFile(i){let f=current[i];let n=await showAlert('✏️','Rename File','Enter a new name:',true,f.name,true);if(!n||n===f.name)return;if(renameVault(CATEGORY,f.name,n))toast('Renamed');else toast('Rename failed - name may already exist',true)}
async function deleteFileAt(i){let f=current[i];let ok=await showAlert('🗑️','Delete File','Delete '+f.name+' permanently?',false,'',true);if(ok){deleteVault(CATEGORY,f.name);toast('Deleted');}}
window.onNativeFilesImported=onNativeFilesImported;loadCategory();
</script></body></html>
